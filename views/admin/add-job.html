<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Job</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow p-4">

            <h2 class="text-center mb-4">Add New Job</h2>

            <form action="/admin/jobs/add" method="POST">

                <div class="mb-3">
                    <label class="form-label">Company Name</label>
                    <input type="text"
                           name="company_name"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Job Title</label>
                    <input type="text"
                           name="job_title"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Location</label>
                    <input type="text"
                           name="location"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Salary</label>
                    <input type="text"
                           name="salary"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Minimum CGPA</label>
                    <input type="number"
                           step="0.01"
                           name="min_cgpa"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Branch</label>
                    <input type="text"
                           name="branch"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Graduation Year</label>
                    <input type="number"
                           name="graduation_year"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Job Description</label>

                    <textarea name="description"
                              class="form-control"
                              rows="4"></textarea>
                </div>

                <button type="submit"
                        class="btn btn-primary w-100">
                    Add Job
                </button>

            </form>

        </div>

    </div>

</body>

</html>
