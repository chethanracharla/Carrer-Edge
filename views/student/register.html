<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

    <div class="container my-5">

        <div class="row registration-card shadow-lg rounded overflow-hidden">

            <!-- ================= LEFT PANEL ================= -->

            <div class="col-lg-5 bg-primary text-white p-5">

                <div class="text-center">

                    <h1 class="display-1">
                        🎓
                    </h1>

                    <h2 class="fw-bold mt-4">
                        Welcome!
                    </h2>

                    <p class="mt-4">

                        Register yourself and begin your placement journey with top companies.

                    </p>

                </div>

            </div>

            <!-- ================= RIGHT PANEL ================= -->

            <div class="col-lg-7 bg-white p-5">

                <h2 class="fw-bold mb-4">

                    Student Registration

                </h2>

                <form action="/student/register" method="POST">

                    <!-- ================= Row 1 ================= -->

                    <div class="row">

                        <!-- Full Name -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Full Name

                            </label>


                            <input
                                type="text"
                                name="full_name"
                                class="form-control"
                                placeholder="Enter your full name">

                        </div>

                        <!-- Email -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Email Address

                            </label>

                            <input
                                type="email"
                                class="form-control"
                                name="email"
                                placeholder="Enter your email">

                        </div>

                    </div>

                    <!-- ================= Row 2 ================= -->

                    <div class="row">

                        <!-- Phone Number -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Phone Number

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="phone"
                                placeholder="Enter your phone number">

                        </div>

                        <!-- College Name -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                College Name

                            </label>

                            <input
                                type="text"
                                name="college"
                                class="form-control"
                                placeholder="Enter your college name">

                        </div>

                    </div>

                    <!-- ================= Row 3 ================= -->

                    <div class="row">

                        <!-- Branch -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Branch

                            </label>

                            <input
                                type="text"
                                name="branch"
                                class="form-control"
                                placeholder="Example: CSE">

                        </div>

                        <!-- Graduation Year -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Graduation Year

                            </label>

                            <input

                                type="number"
                                name="graduation_year"
                                class="form-control"
                                placeholder="2025">

                        </div>

                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">CGPA</label>
                            <input type="number" name="cgpa"  step="0.01" class="form-control" placeholder="Enter your CGPA"/>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">skills</label>
                            <input type="text" name="skills" class="form-control" placeholder="Enter your technical skills"/>
                        </div>
                    </div>

                    
                    <!-- ================= Row 5 ================= -->

                    <div class="row">

                        <!-- Password -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Password

                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter your password">

                        </div>

                        <!-- Confirm Password -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Confirm Password

                            </label>

                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control"
                                placeholder="Confirm your password">

                        </div>

                    </div>

                    <!-- ================= Resume Upload ================= -->

                    <div class="mb-4">

                        <label class="form-label">

                            Upload Resume

                        </label>

                        <input
                            type="file"
                            name="resume"
                            class="form-control">

                    </div>

                    <!-- ================= Register Button ================= -->

                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-success btn-lg">

                            Register

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
